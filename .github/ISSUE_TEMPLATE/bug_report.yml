name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Kaddio integration version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: connected_to
    attributes:
      label: What did you connect?
      options:
        - A room
        - A place
        - All rooms and places
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings, System, Logs, search for "kaddio". Remove anything private.
      render: text
