name: Home Assistant beta

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  tests-against-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --pre -r requirements_test.txt
      - run: pytest -q
