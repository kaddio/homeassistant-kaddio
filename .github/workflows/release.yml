name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the manifest version
        run: |
          manifest_version=$(python3 -c "import json; print(json.load(open('custom_components/kaddio/manifest.json'))['version'])")
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version v${manifest_version}"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements_test.txt

      - run: pytest -q

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
